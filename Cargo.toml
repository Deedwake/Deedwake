[package]
name = "deedwake-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "0BSD"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"], optional = true }

[features]
snapshot-serde = ["dep:serde"]

[workspace]
members = ["example-web", "repair-web", "repair-tool"]
resolver = "3"
