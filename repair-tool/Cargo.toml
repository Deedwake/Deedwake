[package]
name = "deedwake-repair-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "0BSD"
publish = false

[[bin]]
name = "repair-tool"
path = "src/main.rs"

[dependencies]
deedwake-core = { path = ".." }
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
