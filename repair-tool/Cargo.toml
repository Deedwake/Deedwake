[package]
name = "deedwake-repair-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "0BSD"
publish = false
default-run = "repair-tool"

[[bin]]
name = "repair-tool"
path = "src/main.rs"

[[bin]]
name = "convoy-tool"
path = "src/convoy_tool.rs"

[[bin]]
name = "convoy-baseline"
path = "src/convoy_baseline.rs"

[dependencies]
deedwake-core = { path = "..", features = ["snapshot-serde"] }
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
