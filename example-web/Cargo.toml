[package]
name = "deedwake-example-web"
version = "0.1.0"
edition = "2024"
license = "0BSD"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deedwake-core = { path = ".." }

[build-dependencies]
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }

[[example]]
name = "convoy_configured"
path = "../examples/convoy/configured_native.rs"
